version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: gomicrox-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: gomicrox
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d gomicrox"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gomicrox-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: gomicrox-redis
    command: redis-server --requirepass 12345678 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "12345678", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gomicrox-network

  # Auth RPC 服务（gRPC + HTTP gateway，port 10003/10000）
  auth-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/auth
        PORT: 10003
    container_name: gomicrox-auth-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=gomicrox port=5432 sslmode=disable TimeZone=Asia/Shanghai
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
    ports:
      - "10003:10003"
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gomicrox-network
    restart: unless-stopped

  # App 服务（REST API，port 10002）
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/app
        PORT: 10002
    container_name: gomicrox-app
    environment:
      # app 不直连数据库，所有数据操作通过 RPC
      - REDIS_ADDRESS=redis:6379
      - REDIS_PASSWORD=12345678
      - AUTHRPC_ENDPOINT=auth-rpc:10003
      - UPLOADRPC_ENDPOINT=upload-rpc:10004
    ports:
      - "10002:10002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-rpc:
        condition: service_started
      upload-rpc:
        condition: service_started
    networks:
      - gomicrox-network
    restart: unless-stopped

  # Admin 服务（REST API，port 10001）
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/admin
        PORT: 10001
    container_name: gomicrox-admin
    environment:
      # admin 不直接访问 DB/Redis，所有数据操作通过 auth-rpc
      - AUTHRPC_ENDPOINT=auth-rpc:10003
    ports:
      - "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-rpc:
        condition: service_started
    networks:
      - gomicrox-network
    restart: unless-stopped

  # Upload RPC 服务（gRPC，port 10004）
  upload-rpc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./services/rpc/upload
        PORT: 10004
    container_name: gomicrox-upload-rpc
    environment:
      - DATABASE_DSN=host=postgres user=root password=123456 dbname=gomicrox port=5432 sslmode=disable TimeZone=Asia/Shanghai
    ports:
      - "10004:10004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gomicrox-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  gomicrox-network:
    driver: bridge
