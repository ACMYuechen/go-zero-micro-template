Name: upload.rpc
ListenOn: 0.0.0.0:10004
Timeout: 600000
MaxBytes: 524288000

# 认证中心 RPC（token 校验走 auth-rpc，不本地解析）
AuthRpc:
  Endpoints:
    - 127.0.0.1:10003
  NonBlock: true

Database:
  LogLevel: 4
  Driver: "Postgres"
  DSN: host=127.0.0.1 user=root password=123456 dbname=gomicrox port=5432 sslmode=disable TimeZone=Asia/Shanghai
  MaxOpenConns: 100    # 最大打开连接数
  MaxIdleConns: 20     # 最大空闲连接数
  ConnMaxLifetime: 7200s # 连接最大存活时间
  ConnMaxIdleTime: 300s  # 连接最大空闲时间
  AutoMigrate: true
  PrepareStmt: true

OSS:
  Endpoint: ${OSS_ENDPOINT}
  AccessKeyID: ${OSS_ACCESS_KEY_ID}
  AccessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  BucketName: ${OSS_BUCKET_NAME}
  Domain: ${OSS_DOMAIN}
